# Servidor de IA de AIESS: el modelo LFM2 entrenado + la web, en una sola dirección.
# Funciona en Oracle Cloud (Ampere A1 ARM64 o x86) y en cualquier Linux con Docker.
#
#   1) Copia el modelo:   modelos/aiess-lfm2-1.2b-Q4_K_M.gguf
#   2) Copia la web:      web/   (contenido de app/build/web)
#   3) Edita .env:        DOMINIO=ia.tudominio.com  (o deja :80 para usar solo la IP)
#   4) docker compose up -d
#
# Privacidad: llama-server NO guarda los correos: sin --log-prompts-dir, sin endpoint /slots (--no-slots)
# y sin escribir nada a disco. El texto queda solo en memoria y se reemplaza con la siguiente revisión.
# Nombre propio: no choca con otros proyectos del mismo servidor.
name: aiess

services:
  ia:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ./modelos:/modelos:ro
    command: >
      -m /modelos/aiess-lfm2-1.2b-Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      -c ${CONTEXTO:-8192} -np ${PARALELO:-4}
      --threads ${HILOS:-4}
      --cache-reuse 256
      --no-slots
      --api-key ${AIESS_CLAVE:?Define AIESS_CLAVE en .env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Caddy sirve la web (archivos estáticos) y pasa solo la API al modelo.
  # HTTPS automático (Let's Encrypt) si DOMINIO apunta a la IP pública del servidor.
  web:
    image: caddy:2
    restart: unless-stopped
    depends_on: [ia]
    # Puertos configurables: si el servidor ya usa 80/443 para otro proyecto, usa PUERTO_HTTP=8090
    # y PUERTO_HTTPS=127.0.0.1:8443 (así no se toca lo que ya está corriendo).
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    environment:
      DOMINIO: ${DOMINIO:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/web:ro
      - caddy_datos:/data

volumes:
  caddy_datos:
