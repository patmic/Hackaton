<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AIESS: robot guardián para reconocer estafas del IESS.">
  <meta name="theme-color" content="#145962">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AIESS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AIESS · Robot guardián</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Pantalla de carga: aparece al instante mientras se descarga la app (sin pantalla en blanco). */
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 18px; background: #0a1a26; color: #f8fafc;
             font: 600 20px/1.4 system-ui, sans-serif; transition: opacity .35s ease; z-index: 9; }
    #carga img { width: 120px; height: 120px; border-radius: 28px; animation: latir 1.6s ease-in-out infinite; }
    #carga .barra { width: 180px; height: 6px; border-radius: 6px; background: #1e3442; overflow: hidden; }
    #carga .barra::after { content: ""; display: block; width: 40%; height: 100%; background: #3db28c;
                           border-radius: 6px; animation: avanzar 1.2s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(1.06); } }
    @keyframes avanzar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #carga img, #carga .barra::after { animation: none; } }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Preparando a AIess…</div>
    <div class="barra"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (!c) return;
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- OCR de PDF e imágenes en el propio navegador (el archivo no sale del equipo). -->
  <script src="ocr_aiess.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
