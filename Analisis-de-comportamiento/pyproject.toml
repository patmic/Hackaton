[project]
name = "observador-comportamiento"
version = "1.0.0"
description = "Observador de comportamiento del Escudo Cognitivo IESS: aprende de los correos de prueba y personaliza la capacitación."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # solo biblioteca estándar

[project.optional-dependencies]
api = ["fastapi>=0.110"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["observador"]
